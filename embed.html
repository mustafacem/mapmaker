<div style="width:auto">
<style>
    html, body { margin: 0; padding: 0; }
    button { text-align: center; padding: 0; background: hsl(60,20%,90%); border-radius: 4px; cursor: pointer; }
    button svg { width: 100%; height: 100%; }
    button text { text-anchor: middle; font-size: 24px; font-family: var(--sans-serif, Arial); }
    button.current-control { background: hsl(60,100%,80%); outline: 2px solid hsl(220,50%,50%); }
    button:focus { outline: none; }
    input[type="range"] { cursor: ew-resize; margin-left: 0; margin-right: 0; accent-color: hsl(0, 50%, 50%); }
    button:disabled, input:disabled { cursor: unset; opacity: 0.25; }
    #ui {
        display: grid;
        min-height: calc(100vmin - 130px);
        grid-template-rows: repeat(4, 40px) calc(100vmin - 130px - 160px - 40px);
        grid-template-columns: 1fr calc(100vmin - 130px) repeat(4, 30px) 1fr;
        grid-row-gap: 10px;
        grid-column-gap: 10px;
    }
    #map        { grid-area: 1 / 2 / span 5 / span 1; position: relative; height: 100%; }
    #tiny       { grid-area: 1 / 3 / span 1 / span 1; }
    #small      { grid-area: 1 / 4 / span 1 / span 1; }
    #medium     { grid-area: 1 / 5 / span 1 / span 1; }
    #large      { grid-area: 1 / 6 / span 1 / span 1; }
    #ocean      { grid-area: 2 / 3 / span 1 / span 2; }
    #shallow    { grid-area: 2 / 5 / span 1 / span 2; }
    #valley     { grid-area: 3 / 3 / span 1 / span 2; }
    #mountain   { grid-area: 3 / 5 / span 1 / span 2; }
    #desert     { grid-area: 4 / 3 / span 1 / span 2; }
    #sliders    { grid-area: 5 / 3 / span 1 / span 4; overflow-y: scroll; overflow-x: clip; line-height: 1.1; }

    @media (orientation: portrait) {
        /* Put the buttons on bottom instead of on the right */
        #ui {
            grid-template-rows: calc(100vmin) repeat(4, 40px) 1fr;
            grid-template-columns: 70px 70px calc(100vmin - 50px - 140px - 40px);
        }
        #map { grid-area: 1 / 1 / span 1 / span 6; }
        #tiny { grid-area: 2 / 1 / span 1 / span 1; }
        #small { grid-area: 3 / 1 / span 1 / span 1; }
        #medium { grid-area: 4 / 1 / span 1 / span 1; }
        #large { grid-area: 5 / 1 / span 1 / span 1; }
        #ocean { grid-area: 2 / 2 / span 1 / span 1; }
        #shallow { grid-area: 3 / 2 / span 1 / span 1; }
        #valley { grid-area: 4 / 2 / span 1 / span 1; }
        #mountain { grid-area: 5 / 2 / span 1 / span 1; }
        #desert { grid-area: 6 / 1 / span 1 / span 1; }
        #sliders { grid-area: 2 / 3 / span 5 / span 1; justify-self: end; width: 100%; column-width: 20ch; }
    }

    #mapgen4 { width: 100%; height: 100%; cursor: crosshair; display: block; }
    #overlay-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; opacity: 0.5; }
    #sliders h3 {
        background-color: hsl(60,20%,90%);
        margin: 0.5em 0;
        padding: 0.5em;
        font-family: var(--sans-serif, sans-serif);
        font-size: 66%;
    }
    #sliders label {
        display: block;
        font-size: 66%;
    }
    #sliders label > * {
        max-width: 99%;
    }
    #sliders label span {
        font-family: var(--monospace, monospace);
        display: inline-block;
        width: 17ch;
    }
    #button-reset, #button-download, #button-save, #button-load-trigger, #button-overlay, #button-overlay-remove {
        display: inline-block;
        margin-left: auto;
        margin-right: auto;
        width: 49%;
        height: 2em;
    }
    label.file-btn {
        display: inline-block;
        margin-left: auto;
        margin-right: auto;
        width: 49%;
        height: 2em;
        line-height: 2em;
        text-align: center;
        background: hsl(60,20%,90%);
        border-radius: 4px;
        cursor: pointer;
        font-size: 100%;
        box-sizing: border-box;
        vertical-align: top;
    }
    label.file-btn:hover { background: hsl(60,20%,85%); }
</style>

  <div id="ui">

  <button id="tiny"><svg viewBox="-50 -50 100 100"><circle r="7"/></svg></button>
  <button id="small"><svg viewBox="-50 -50 100 100"><circle r="20"/></svg></button>
  <button id="medium"><svg viewBox="-50 -50 100 100"><circle r="35"/></svg></button>
  <button id="large"><svg viewBox="-50 -50 100 100"><circle r="50"/></svg></button>

  <button id="ocean" title="Ocean"><svg viewBox="-50 -50 100 100"><text y="45">Ocean</text><path d="M -50,-30 q 25,-20 50,0 q 25,20 50,0 l 0,50 l -100,0 z" fill="hsl(240,50%,40%)"/></svg></button>
  <button id="shallow" title="Water"><svg viewBox="-50 -50 100 100"><text y="45">Water</text><path d="M -50,-20 q 15,20 30,0 q 20,20 40,0 q 15,20 30,0 l 0,40 l -100,0 z" fill="hsl(200,50%,70%)"/></svg></button>
  <button id="valley" title="Valley"><svg viewBox="-50 -50 100 100"><text y="45">Valley</text><path d="M -50,-20 c 20,10 80,10 100,0 l 0,40 l -100,0 z" fill="hsl(100,40%,60%)"/></svg></button>
  <button id="mountain" title="Mountain"><svg viewBox="-50 -50 100 100"><text y="45">Mountains</text><g fill="hsl(60,50%,40%)" stroke="white" stroke-width="2"><path d="M -30,20 l 30,-60 l 30,60 z"/><path d="M -50,20 l 20,-40 l 20,40 z"/><path d="M 10,20 l 15,-30 l 15,30 z"/></g></svg></button>
  <button id="desert" title="Desert (T)"><svg viewBox="-50 -50 100 100"><text y="45">Desert</text><path d="M -50,0 q 25,-35 50,0 q 25,35 50,0 l 0,30 l -100,0 z" fill="hsl(45,60%,65%)"/><circle cx="-10" cy="-30" r="12" fill="hsl(50,100%,65%)"/></svg></button>

  <div id="sliders">
    <button id="button-reset">Reset</button><button id="button-download">Download PNG</button>
    <button id="button-save">Save project</button><label class="file-btn" for="input-load">Load project</label><input id="input-load" type="file" accept=".json" style="display:none"/>
    <label class="file-btn" for="input-overlay">Add overlay</label><button id="button-overlay-remove">Remove overlay</button><input id="input-overlay" type="file" accept="image/*" style="display:none"/>
    <div style="font-size:66%;margin-top:4px">
      <label style="display:block">Brush size &nbsp;<input id="brush-size" type="range" min="0.1" max="3" step="0.05" value="1" style="width:70%"/></label>
      <label style="display:block">Brush strength<input id="brush-rate" type="range" min="0.1" max="3" step="0.05" value="1" style="width:70%"/></label>
      <label style="display:block">Overlay opacity<input id="overlay-opacity" type="range" min="0" max="1" step="0.05" value="0.5" style="width:70%"/></label>
      <label style="display:block">Resolution &nbsp;&nbsp;<select id="select-resolution" style="font-size:100%"><option value="512">Low (512)</option><option value="1024">Med (1024)</option><option value="2048">High (2048)</option><option value="4096">Ultra (4096)</option></select></label>
      <label style="display:block">Cell density &nbsp;<select id="select-spacing" style="font-size:100%"><option value="1">Dense (1)</option><option value="2">Normal (2)</option><option value="4">Sparse (4)</option><option value="8">Very sparse (8)</option></select></label>
    </div>
    <h3>Batch from image</h3>
    <div style="font-size:66%">
      <label class="file-btn" for="input-batch" style="width:99%;margin-bottom:2px">Select image…</label><input id="input-batch" type="file" accept="image/*" style="display:none"/>
      <label style="display:block">Grid &nbsp;<input id="batch-cols" type="number" min="1" max="8" value="2" style="width:3ch"/> × <input id="batch-rows" type="number" min="1" max="8" value="2" style="width:3ch"/> tiles</label>
      <button id="button-batch-run" style="width:99%;height:2em;margin-top:2px">Generate &amp; Download</button>
      <div id="batch-status" style="font-style:italic;margin-top:2px"></div>
    </div>
  </div>

  <div id="map">
    <canvas id="mapgen4" width="4096" height="4096"></canvas>
    <img id="overlay-img" alt="overlay"/>
  </div>
  </div>
  <script defer="defer" src="build/_bundle.js"></script>
</div>
